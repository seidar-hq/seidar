[package]
name = "seidar-live"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }

# Mirrors of external Soroban interfaces (Blend V2 pool, Reflector SEP-40,
# Soroswap aggregator). Versioned per upstream release; regenerate from the
# upstream WASM IDL before mainnet and pin hashes in configs/networks.json.
