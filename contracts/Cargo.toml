[workspace]
members = ["iface", "leverage", "receiver", "fork"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "28"
seidar-leverage-iface = { path = "iface" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
