[package]
name = "seidar-leverage-fork-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Mainnet-fork tests: real Blend Fixed v2.1 / Reflector / Soroswap aggregator
# ledger entries (fixtures/mainnet.json) loaded into a soroban test Env, with
# the leverage + receiver WASMs (build them first: stellar contract build).

[lib]
path = "src/lib.rs"
doctest = false

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-ledger-snapshot = "28"
seidar-leverage-iface = { workspace = true }
serde_json = "1"
base64 = "0.22"
